name: Publish

# Push a tag v<version> (the version in package.json, e.g. v1.0.1) to publish @winche-technologies/winche-plugin-stripe to npm.
# npm trusted publishing (OIDC): no npm token is stored; npm adds provenance on its own.

on:
  push:
    tags:
      - 'v*'

permissions:
  id-token: write   # npm trusted publishing
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          registry-url: 'https://registry.npmjs.org'

      # Trusted publishing needs npm 11.5.1 or later.
      - name: npm
        run: npm install -g npm@latest

      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.9.8

      - name: The tag matches the version
        run: |
          version=$(node -p 'require("./package.json").version')
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "::error::Tag $GITHUB_REF_NAME doesn't match the version in package.json ($version)."
            exit 1
          fi

      - name: Install
        run: npm ci

      - name: Build and test
        run: npm test

      - name: Publish
        run: npm publish --access public
